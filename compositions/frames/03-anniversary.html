    <div data-hf-id="hf-bre3" id="ann-c-bottom" data-layout-ignore><div data-hf-id="hf-qz4p" class="ann-c-bottomline"></div><div data-hf-id="hf-7s4e" id="ann-c-bottomdots"><i data-hf-id="hf-d63b" class="ann-c-dot"></i><i data-hf-id="hf-28ev" class="ann-c-dot"></i><i data-hf-id="hf-1u3u" class="ann-c-dot"></i><i data-hf-id="hf-1fst" class="ann-c-dot"></i></div><div data-hf-id="hf-ruwd" class="ann-c-bottomline"></div></div>

</div>

<script>
(() => {
  const tl=gsap.timeline({paused:true});
  const beat=0.46875;
  const q=(s)=>document.querySelector('#anniversary-root '+s);
  const qa=(s)=>Array.from(document.querySelectorAll('#anniversary-root '+s));
  const ticks=q('#ann-v-ticks');
  for(let i=0;i<26;i++){const e=document.createElement('i');e.className='ann-v-tick';e.style.height=(28+(i%5)*9)+'px';ticks.appendChild(e);}
  const foot=q('#ann-v-foot-ticks');
  for(let i=0;i<45;i++){const e=document.createElement('i');e.className='ann-foot-tick';e.style.height=(i%5===0?23:10)+'px';foot.appendChild(e);}
  const population=q('#ann-population');
  for(let i=0;i<104;i++){const e=document.createElement('i');e.className='ann-person-dot';population.appendChild(e);}

  const groups=['#ann-versions','#ann-ui','#ann-people','#ann-montage','#ann-close'];
  groups.forEach((s,i)=>{
    tl.set(q(s),{autoAlpha:i===0?1:0},0);
    if(i>0)tl.set(q(s),{autoAlpha:1},i*3.75);
    if(i<4)tl.set(q(s),{autoAlpha:0},(i+1)*3.75);
  });

  // 33.75–37.5: two clearly paired release rows, directional time rails.
  tl.fromTo(q('#ann-v-year'),{y:-65,opacity:.2},{y:0,opacity:1,duration:beat,ease:'power3.out'},0);
  tl.fromTo(q('#ann-v55'),{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:beat*.95,ease:'power3.out'},0);
  tl.fromTo(q('#ann-v56'),{clipPath:'inset(0 0 0 100%)'},{clipPath:'inset(0 0 0 0%)',duration:beat*.95,ease:'power3.out'},beat);
  tl.fromTo(q('#ann-v55-model'),{x:-70},{x:0,duration:beat,ease:'power3.out'},0);
  tl.fromTo(q('#ann-v56-model'),{x:70},{x:0,duration:beat,ease:'power3.out'},beat);
  tl.fromTo(q('#ann-v55-date'),{opacity:0,y:24},{opacity:1,y:0,duration:beat*.7,ease:'power2.out'},beat*.6);
  tl.fromTo(q('#ann-v56-date'),{opacity:0,y:24},{opacity:1,y:0,duration:beat*.7,ease:'power2.out'},beat*1.6);
  tl.fromTo(q('#ann-v55-rail'),{scaleX:0},{scaleX:1,duration:beat*2,ease:'power3.out'},beat*2);
  tl.fromTo(q('#ann-v56-rail'),{scaleX:0},{scaleX:1,duration:beat*2,ease:'power3.out'},beat*3);
  qa('.ann-v-tick').forEach((e,i)=>{
    tl.fromTo(e,{scaleY:.15,opacity:.3},{scaleY:1,opacity:1,duration:beat*.7,ease:'power2.out'},(i%8)*beat*.25);
    tl.to(e,{scaleY:.45+(i%3)*.15,duration:beat*.5,yoyo:true,repeat:3,ease:'sine.inOut'},1.875+(i%3)*beat*.2);
  });
  qa('.ann-foot-tick').forEach((e,i)=>tl.fromTo(e,{scaleY:0},{scaleY:1,duration:beat*.35,ease:'power2.out'},beat*2+i*.026));

  // 37.5–41.25: lively diagram, never presented as a real product screenshot.
  const u=3.75;
  tl.fromTo(q('#ann-ui-model'),{y:65,opacity:0},{y:0,opacity:1,duration:beat,ease:'power3.out'},u);
  tl.fromTo(q('#ann-ui-astra'),{x:-45,opacity:0},{x:0,opacity:1,duration:beat*.8,ease:'power2.out'},u+beat*.5);
  tl.fromTo(q('#ann-ui-ui-date'),{x:-45,opacity:0},{x:0,opacity:1,duration:beat*.8,ease:'power2.out'},u+beat);
  tl.fromTo(q('#ann-ui-claim'),{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:beat*1.2,ease:'power3.out'},u+beat*1.7);
  qa('.ann-ui-module').forEach((e,i)=>tl.fromTo(e,{x:i%2?90:-50,y:i<2?-50:55,scale:.8,opacity:0},{x:0,y:0,scale:1,opacity:1,duration:beat*1.1,ease:'back.out(1.2)'},u+i*beat*.35));
  tl.fromTo(q('#ann-ui-orbits'),{rotation:0},{rotation:180,duration:3.75,ease:'none',transformOrigin:'50% 50%'},u);
  qa('.ann-ui-bar').forEach((e,i)=>{
    tl.fromTo(e,{scaleY:.12},{scaleY:1,duration:beat*.8,ease:'power3.out'},u+beat+i*.065);
    tl.to(e,{scaleY:.4+(i%3)*.18,duration:beat,yoyo:true,repeat:3,ease:'sine.inOut'},u+beat*3+i*.045);
  });
  ['#ann-knob1','#ann-knob2','#ann-knob3'].forEach((s,i)=>tl.fromTo(q(s),{x:15+i*25},{x:170-i*25,duration:beat*(2+i*.5),yoyo:true,repeat:1,ease:'power2.inOut'},u+beat*2+i*.08));
  qa('.ann-grid-center').forEach((e,i)=>tl.fromTo(e,{scale:.15},{scale:1,duration:beat*.6,yoyo:true,repeat:5,ease:'sine.inOut'},u+beat+i*.1));

  // 41.25–45: the digits are static nodes; count feel comes from mechanical landings.
  const p=7.5;
  ['#ann-p-one','#ann-p-two','#ann-p-unit','#ann-p-plus'].forEach((s,i)=>tl.fromTo(q(s),{y:230,opacity:0},{y:0,opacity:1,duration:beat*.8,ease:'power4.out'},p+i*beat*.25));
  tl.fromTo(q('#ann-p-value'),{scale:1.07},{scale:1,duration:beat*.9,ease:'power3.out'},p+beat);
  tl.fromTo(q('#ann-p-label'),{y:40,opacity:0},{y:0,opacity:1,duration:beat*.8,ease:'power2.out'},p+beat*.7);
  tl.fromTo(q('#ann-p-date'),{y:25,opacity:0},{y:0,opacity:1,duration:beat*.8,ease:'power2.out'},p+beat);
  tl.fromTo(q('#ann-p-rule'),{scaleX:0},{scaleX:1,duration:beat*1.5,ease:'power3.out'},p+beat*1.5);
  qa('.ann-person-dot').forEach((e,i)=>{
    const row=Math.floor(i/8),col=i%8;
    tl.fromTo(e,{x:(col-3.5)*26,y:(row-6)*18,scale:.1,opacity:0},{x:0,y:0,scale:1,opacity:1,duration:beat*.8,ease:'back.out(1.4)'},p+((row+col)%9)*beat*.16);
    if(i%9===0)tl.to(e,{scale:.6,duration:beat*.6,yoyo:true,repeat:3,ease:'sine.inOut'},p+1.875+(i%5)*.06);
  });

  // 45–48.75: four independently moving typographic environments lock as one.
  const m=11.25;
  const panels=['#ann-m-ask','#ann-m-think','#ann-m-see','#ann-m-do'];
  panels.forEach((s,i)=>{
    tl.fromTo(q(s),{clipPath:i%2?'inset(0 0 0 100%)':'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0%)',duration:beat*.7,ease:'power3.out'},m+i*beat*1.5);
  });
  const verbs=['#ann-word-ask','#ann-word-think','#ann-word-see','#ann-word-do'];
  verbs.forEach((s,i)=>tl.fromTo(q(s),{y:55,opacity:0},{y:0,opacity:1,duration:beat*.7,ease:'power4.out'},m+i*beat*1.5));
  tl.fromTo(q('#ann-m-caption'),{opacity:0,y:24},{opacity:1,y:0,duration:beat*.7,ease:'power2.out'},m+beat*5);
  tl.fromTo(q('#ann-ask-orbit'),{scale:.75},{scale:1,duration:beat,yoyo:true,repeat:5,ease:'sine.inOut'},m+beat);
  tl.fromTo(q('#ann-ask-dot'),{x:-65},{x:65,duration:beat*1.5,yoyo:true,repeat:2,ease:'sine.inOut'},m+beat*.7);
  qa('.ann-think-line').forEach((e,i)=>tl.fromTo(e,{scaleX:.08},{scaleX:1,duration:beat*.75,ease:'power3.out'},m+beat*2+i*beat*.3));
  tl.fromTo(q('#ann-see-pupil'),{x:-48},{x:48,duration:beat*1.1,yoyo:true,repeat:1,ease:'power2.inOut'},m+beat*3.5);
  qa('.ann-do-cell').forEach((e,i)=>tl.fromTo(e,{scale:.1,rotation:-30,opacity:0},{scale:1,rotation:0,opacity:1,duration:beat*.7,ease:'back.out(1.7)'},m+beat*4.5+(i%3+Math.floor(i/3))*.06));

  // 48.75–52.5: full required wording is present by 49.6875, then holds.
  const c=15;
  tl.fromTo(q('#ann-c-name'),{y:54,opacity:0},{y:0,opacity:1,duration:beat*.8,ease:'power3.out'},c);
  tl.fromTo(q('#ann-c-tribute'),{y:54,opacity:0},{y:0,opacity:1,duration:beat*.8,ease:'power3.out'},c+beat*.25);
  ['#ann-c-dates','#ann-c-disclaimer','#ann-c-cutoff'].forEach((s,i)=>tl.fromTo(q(s),{opacity:0,y:20},{opacity:1,y:0,duration:beat*.6,ease:'power2.out'},c+beat*(.5+i*.22)));
  tl.fromTo(q('#ann-c-rule'),{scaleX:0},{scaleX:1,duration:beat*.9,ease:'power3.out'},c+beat*.5);
  tl.fromTo(q('#ann-c-four'),{y:55,scale:.82,opacity:0},{y:0,scale:1,opacity:1,duration:beat*1.1,ease:'power3.out'},c);
  qa('.ann-c-block').forEach((e,i)=>{
    tl.fromTo(e,{x:i%2?80:-80,y:i<2?-50:50,scale:.4,rotation:i%2?25:-25,opacity:0},{x:0,y:0,scale:1,rotation:0,opacity:1,duration:beat*.85,ease:'back.out(1.4)'},c+i*beat*.2);
    tl.to(e,{rotation:i%2?6:-6,duration:beat*1.5,yoyo:true,repeat:2,ease:'sine.inOut'},c+beat*2+i*.04);
  });
  qa('.ann-c-dot').forEach((e,i)=>tl.fromTo(e,{scale:.3,opacity:.3},{scale:1,opacity:1,duration:beat*.6,ease:'power2.out'},c+beat*1.1+i*.07));
  tl.fromTo(qa('.ann-c-bottomline'),{scaleX:0},{scaleX:1,duration:beat*1.4,ease:'power3.out'},c+beat*.5);

  window.__timelines['03-anniversary']=tl;
  tl.seek(0);
})();
</script>
</template>
